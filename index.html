<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Quality Assurance Management System</title>
    <meta
      name="description"
      content="Streamline quality assurance in agile development with automated story validation, risk prioritization, and real-time quality tracking for QA teams."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
      }
      #app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        color: #f8fafc;
        z-index: 9999;
      }
      .preloader-spinner-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
      }
      .preloader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #6366f1;
        border-right-color: #818cf8;
        animation: preloader-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .preloader-ring:nth-child(2) {
        inset: 6px;
        border-top-color: #a855f7;
        border-right-color: transparent;
        animation: preloader-spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse;
      }
      .preloader-logo {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 16px;
        letter-spacing: 1px;
        color: #e0e7ff;
      }
      .preloader-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(to right, #ffffff, #c7d2fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 8px 0;
      }
      .preloader-subtitle {
        font-size: 13px;
        color: #94a3b8;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        animation: preloader-pulse 2s ease-in-out infinite;
      }
      @keyframes preloader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="app-preloader">
        <div class="preloader-spinner-wrapper">
          <div class="preloader-ring"></div>
          <div class="preloader-ring"></div>
          <div class="preloader-logo">AQMS</div>
        </div>
        <h1 class="preloader-title">Agile Quality Management System</h1>
        <p class="preloader-subtitle">Initializing Secure Environment...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
