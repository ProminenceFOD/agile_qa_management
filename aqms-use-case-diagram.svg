<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background:white">
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#1F2937" font-size="24" font-weight="700">AQMS Use Case Diagram</text>

  <!-- System Boundary -->
  <rect x="200" y="80" width="800" height="650" fill="none" stroke="#3B82F6" stroke-width="3" rx="8"/>
  <text x="600" y="110" text-anchor="middle" fill="#3B82F6" font-size="16" font-weight="600">AQMS - Automated Quality Management System</text>

  <!-- Actor 1: Product Manager (Left Top) -->
  <circle cx="80" cy="250" r="12" fill="none" stroke="#1F2937" stroke-width="2"/>
  <line x1="80" y1="262" x2="80" y2="290" stroke="#1F2937" stroke-width="2"/>
  <line x1="65" y1="275" x2="95" y2="275" stroke="#1F2937" stroke-width="2"/>
  <line x1="80" y1="290" x2="68" y2="310" stroke="#1F2937" stroke-width="2"/>
  <line x1="80" y1="290" x2="92" y2="310" stroke="#1F2937" stroke-width="2"/>
  <text x="80" y="330" text-anchor="middle" fill="#1F2937" font-size="13" font-weight="600">Product Manager</text>

  <!-- Actor 2: QA Engineer (Left Bottom) -->
  <circle cx="80" cy="450" r="12" fill="none" stroke="#1F2937" stroke-width="2"/>
  <line x1="80" y1="462" x2="80" y2="490" stroke="#1F2937" stroke-width="2"/>
  <line x1="65" y1="475" x2="95" y2="475" stroke="#1F2937" stroke-width="2"/>
  <line x1="80" y1="490" x2="68" y2="510" stroke="#1F2937" stroke-width="2"/>
  <line x1="80" y1="490" x2="92" y2="510" stroke="#1F2937" stroke-width="2"/>
  <text x="80" y="530" text-anchor="middle" fill="#1F2937" font-size="12" font-weight="600">QA Engineer</text>

  <!-- Actor 3: Scrum Master (Right) -->
  <circle cx="1120" cy="400" r="12" fill="none" stroke="#1F2937" stroke-width="2"/>
  <line x1="1120" y1="412" x2="1120" y2="440" stroke="#1F2937" stroke-width="2"/>
  <line x1="1105" y1="425" x2="1135" y2="425" stroke="#1F2937" stroke-width="2"/>
  <line x1="1120" y1="440" x2="1108" y2="460" stroke="#1F2937" stroke-width="2"/>
  <line x1="1120" y1="440" x2="1132" y2="460" stroke="#1F2937" stroke-width="2"/>
  <text x="1120" y="480" text-anchor="middle" fill="#1F2937" font-size="13" font-weight="600">Scrum Master</text>

  <!-- Product Manager Use Cases (Blue) -->
  <ellipse cx="350" cy="180" rx="100" ry="40" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="350" y="185" text-anchor="middle" fill="#1F2937" font-size="12" font-weight="500">Create User Story</text>

  <ellipse cx="550" cy="180" rx="110" ry="40" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="550" y="175" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Define Acceptance</text>
  <text x="550" y="190" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Criteria</text>

  <ellipse cx="750" cy="180" rx="110" ry="40" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="750" y="175" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Submit for QA</text>
  <text x="750" y="190" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Sign-Off</text>

  <!-- QA Engineer Use Cases (Green) -->
  <ellipse cx="350" cy="320" rx="110" ry="40" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="350" y="315" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Validate Acceptance</text>
  <text x="350" y="330" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Criteria</text>

  <ellipse cx="550" cy="320" rx="100" ry="40" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="550" y="315" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Approve/Reject</text>
  <text x="550" y="330" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Story</text>

  <ellipse cx="350" cy="450" rx="100" ry="40" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="350" y="445" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Record Defect</text>
  <text x="350" y="460" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Telemetry</text>

  <ellipse cx="550" cy="450" rx="100" ry="40" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="550" y="440" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Set Module Risk</text>
  <text x="550" y="455" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Multipliers</text>

  <ellipse cx="750" cy="380" rx="100" ry="40" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="750" y="375" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Link Test Cases</text>
  <text x="750" y="390" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">to Story</text>

  <!-- Scrum Master Use Cases (Orange) -->
  <ellipse cx="850" cy="520" rx="110" ry="40" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="850" y="510" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">View Quality</text>
  <text x="850" y="525" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Burn-Down Dashboard</text>

  <ellipse cx="650" cy="600" rx="100" ry="40" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="650" y="595" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Monitor Sprint</text>
  <text x="650" y="610" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Progress</text>

  <ellipse cx="850" cy="650" rx="100" ry="40" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="850" y="645" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Generate Risk</text>
  <text x="850" y="660" text-anchor="middle" fill="#1F2937" font-size="11" font-weight="500">Priority Matrix</text>

  <!-- Association Lines: Product Manager -->
  <line x1="92" y1="268" x2="250" y2="180" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="92" y1="273" x2="440" y2="180" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="92" y1="278" x2="640" y2="180" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Association Lines: QA Engineer -->
  <line x1="92" y1="470" x2="250" y2="320" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="92" y1="473" x2="450" y2="320" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="92" y1="475" x2="650" y2="380" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="92" y1="477" x2="250" y2="450" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="92" y1="480" x2="450" y2="450" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Association Lines: Scrum Master -->
  <line x1="1060" y1="400" x2="960" y2="520" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="1060" y1="420" x2="750" y2="600" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="1060" y1="430" x2="950" y2="650" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="220" y="730" width="760" height="50" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" rx="4"/>
  <text x="240" y="755" fill="#6B7280" font-size="12" font-weight="600">Legend: Stick Figure = Actor | Oval = Use Case | Line = Association</text>
</svg>
